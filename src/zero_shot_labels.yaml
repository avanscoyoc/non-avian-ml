# Zero-shot (N=0) label mapping: for each class and model, the model's OWN output label(s) that name the
# class (direct matches only). The zero-shot score of a clip is the max over the listed labels; the N=0
# point is that score's AUC on the class's test clips. Classes/models without a direct label get no N=0 point.
#
# Labels match the model's full label string or its scientific-name part (before "_").
# Models: birdnet = BirdNET 2.4, birdnet3 = BirdNET 3.0, perch2 = Perch 2.0, cnn14 = PANNs CNN14 (AudioSet).
# Perch v8 and ResNet-18 have no relevant labels. Check with: pixi run python scripts/zero_shot_label_check.py

mapping:
  device_static:
    cnn14: [Static]
  engine:
    birdnet: [Engine]
    perch2: [Engine, Idling]
    cnn14: [Engine, Idling]
  traffic:
    perch2: [Traffic_noise_and_roadway_noise]
    cnn14: ["Traffic noise, roadway noise"]
  power_tools:
    birdnet: [Power tools]
    perch2: [Power_tool, Drill]
    cnn14: [Power tool, Drill]
  human_vocal:
    birdnet: [Human vocal]
    birdnet3: [Homo Sapiens_Human vocal]
    perch2: [Speech, Human_voice, Homo sapiens]
    cnn14: [Speech]
  metal_clanging:
    cnn14: [Clang]
  airplane:
    perch2: [Fixed-wing_aircraft_and_airplane]
    cnn14: ["Fixed-wing aircraft, airplane"]
  gun:
    birdnet: [Gun]
    perch2: [Gunshot_and_gunfire]
    cnn14: ["Gunshot, gunfire"]
  fireworks:
    birdnet: [Fireworks]
    perch2: [Fireworks]
    cnn14: [Fireworks]
  human_non_vocal:
    birdnet: [Human non-vocal]
  wind:
    perch2: [Wind]
    cnn14: [Wind, Wind noise (microphone)]
  thunder:
    perch2: [Thunder]
    cnn14: [Thunder]
  water:
    perch2: [Water]
    cnn14: [Water]
