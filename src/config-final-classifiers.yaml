experiments:
- name: final_classifiers
  description: "Production run: final classifiers for the noise classes using all available training data per class, single seed, saves classifier bundles."
  models:
  - perch
  - birdnet
  # train = clips per class (capped at the class's training pool); test sets come from the
  # shared recording partition (test_size_per_class), so the `test` values are ignored.
  species_sizes:
    device_static:        {train: 1133, test: 283}
    wind:                 {train: 407,  test: 101}
    generator:            {train: 350,  test: 87}
    traffic:              {train: 238,  test: 59}
    engine:               {train: 136,  test: 34}
    power_tools:          {train: 130,  test: 32}
    human_vocal:          {train: 94,   test: 23}
    metal_clanging:       {train: 48,   test: 12}
    airplane:             {train: 42,   test: 10}
    thunder:              {train: 17,   test: 4}
    gun:                  {train: 20,   test: 4}
    fireworks:            {train: 7,    test: 1}
    water:                {train: 9,    test: 2}
    human_non_vocal:      {train: 7,    test: 1}
  n_epochs: 20
  batch_size: 32
  random_seeds: [1]
  split_seed: 1
  data_path: data
  results_path: results/final_classifiers   # separate from the training-size runs in results/runs
  embeddings_path: results/embeddings       # shared embedding cache
  save_classifier: true
  run_zeroshot: false