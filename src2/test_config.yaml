log_level: INFO
log_format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
save_plots: true
plot_format: png
plot_dpi: 300
max_workers: 4
experiments:
- name: birdnet_test
  models:
  - birdnet  # Test just BirdNET to verify it works
  species:
  - coyote
  training_sizes:
  - 5  # Small size for quick test
  n_folds: 2  # Fewer folds
  batch_size: 8  # Smaller batch
  random_seed: 42
  kfold_seed: 1
  data_path: /workspaces/non-avian-ml/data
  results_path: /workspaces/non-avian-ml/results
  datatype: data