name: Base Image

on:
  workflow_dispatch: null
  push:
    paths: ['.devcontainer/*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      # Free up disk space for large images
      - name: Cleanup disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v3

      # Login to registry (Docker Hub / GHCR / GCP / etc.)
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Build Docker image with both tags
      - name: Build Docker image
        run: |
          IMAGE=${{ secrets.REGISTRY_URL }}/dse-staff/non-avian-ml/model
          docker build base \
            --tag $IMAGE:latest \
            --tag $IMAGE:${{ github.sha }}

      # Push both tags
      - name: Push Docker image
        run: |
          IMAGE=${{ secrets.REGISTRY_URL }}/dse-staff/non-avian-ml/model
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
