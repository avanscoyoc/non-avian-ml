[workspace]
authors = ["Amy Van Scoyoc <avanscoyoc@berkeley.edu>"]
channels = ["conda-forge"]
description = "A comparison of machine learning model performance on non-avian audio"
name = "non-avian-ml"
platforms = ["linux-aarch64", "osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.10.*"
# Core ML frameworks from conda-forge (better ARM support)
pytorch = "*"
torchvision = "*"
torchaudio = "*"
numpy = "*"
scikit-learn = "*"
librosa = "*"
matplotlib = "*"
seaborn = "*"
pyyaml = "*"
tqdm = "*"
pip = "*"

[pypi-dependencies]
# Only packages not available in conda-forge
tensorflow = ">=2.15.0"
tensorflow_hub = "*"
timm = "*"
birdnetlib = "*"
ai-edge-litert = "*"
soundfile = "*"
setuptools = "<81"  # Pin to avoid pkg_resources deprecation warning