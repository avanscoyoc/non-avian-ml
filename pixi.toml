[workspace]
authors = ["Amy Van Scoyoc <avanscoyoc@berkeley.edu>"]
channels = ["conda-forge"]
description = "A comparison of machine learning model performance on non-avian audio"
name = "non-avian-ml"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
# Core ML frameworks from conda-forge (better ARM support)
pytorch = "*"
torchvision = "*"
torchaudio = "*"
numpy = "*"
scikit-learn = "*"
librosa = "*"
matplotlib = "*"
seaborn = "*"
pyyaml = "*"
tqdm = "*"
pip = "*"
setuptools = "<81"  # tensorflow_hub still imports pkg_resources
nodejs = ">=20"

[tasks]
myst-install = "npm install -g mystmd@1.9.1"
myst-build = { cmd = "myst build --pdf", depends-on = ["myst-install"] }
myst-start = { cmd = "myst start", depends-on = ["myst-install"] }

[pypi-dependencies]
tensorflow = ">=2.15.0"
tensorflow_hub = "*"
ai-edge-litert = "*"
soundfile = "*"
birdnet = { version = "==1.1.1", extras = ["pt"] }

# GPU environment for the cirrus server (x86_64 + NVIDIA). PyTorch models and all
# classifier heads run on CUDA; TensorFlow/TFLite models stay on the CPU.
#   pixi install -e gpu
#   pixi run -e gpu python main.py
[feature.gpu]
platforms = ["linux-64"]
system-requirements = { cuda = "12" }

[feature.gpu.dependencies]
pytorch-gpu = "*"
cuda-version = "12.*"

[environments]
gpu = ["gpu"]
